name: Test and deploy VITA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vita-development-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vita_test
          POSTGRES_PASSWORD: synthetic_ci_password
          POSTGRES_DB: vita_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vita_test -d vita_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Go build and tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://vita_test:synthetic_ci_password@localhost:5432/vita_test?sslmode=disable
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...
          go test ./...
          go test -tags=integration -count=1 ./tests/integration
      - name: Python tests
        working-directory: ai-service
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure verified SSH connection
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_/-]+$ && "$DEPLOY_PATH" != / ]]
          [[ "$DEPLOY_PATH" != *..* ]]
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Transfer exact committed source and deploy
        run: |
          set -euo pipefail
          # git archive includes committed code only. Explicitly remove secret files.
          git archive --format=tar HEAD backend ai-service scripts > "$RUNNER_TEMP/vita.tar"
          if tar -tf "$RUNNER_TEMP/vita.tar" | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key)$)' | grep -v '/\.env.example$'; then
            echo 'Refusing deployment archive containing potential secret files.'
            exit 1
          fi
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p "$DEPLOY_PORT")
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          ssh "${SSH_OPTS[@]}" "$remote" "test -d '$DEPLOY_PATH' && test -w '$DEPLOY_PATH' && mkdir -p '$DEPLOY_PATH/releases/$GITHUB_SHA'"
          ssh "${SSH_OPTS[@]}" "$remote" "tar -xf - -C '$DEPLOY_PATH/releases/$GITHUB_SHA'" < "$RUNNER_TEMP/vita.tar"
          ssh "${SSH_OPTS[@]}" "$remote" "bash '$DEPLOY_PATH/releases/$GITHUB_SHA/scripts/deploy-server.sh' '$DEPLOY_PATH' '$GITHUB_SHA'"
      - name: Remove runner SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
