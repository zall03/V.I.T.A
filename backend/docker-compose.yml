services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vita}
      POSTGRES_USER: ${POSTGRES_USER:-vita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    networks: [internal]
    mem_limit: 512m
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    networks: [internal]
    command: ['/app/migrate', 'up']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vita}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vita}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    networks: [internal, edge]
    mem_limit: 512m
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ':8080'
      DATABASE_URL: postgres://${POSTGRES_USER:-vita}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vita}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
  seed:
    build: .
    networks: [internal]
    profiles: ['tools']
    command: ['/app/seed']
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-vita}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vita}?sslmode=disable
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_FACILITY_NAME: ${SEED_FACILITY_NAME:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    command: ['/app/worker']
    networks: [internal]
    mem_limit: 256m
    stop_grace_period: 90s
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vita}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vita}?sslmode=disable
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
  ai-service:
    build: ../ai-service
    networks: [internal, ai_egress]
    mem_limit: 512m
    stop_grace_period: 60s
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env}
      EXTERNAL_AI_ENABLED: ${EXTERNAL_AI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-20}
      GEMINI_MAX_ATTEMPTS: ${GEMINI_MAX_ATTEMPTS:-2}
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health/ready", timeout=2)']
      interval: 10s
      timeout: 3s
      retries: 5
networks:
  internal:
    internal: true
  edge:
  ai_egress:
volumes:
  postgres_data:
